<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מדריך מסכי Oracle EBS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: one narrow reading column (max 760px), large type, search first.
   Every screen is one page with the same five plain questions in the same order.
   Colour marks the kind of screen: setup = indigo, daily work = teal, look-up = slate, periodic = amber. */
:root{
  --bg:#ECEFF4; --panel:#FFFFFF; --panel-2:#F3F5F9; --chrome:#DCE2EB;
  --title:#22304A; --title-ink:#F2F5FA;
  --ink:#162032; --ink-2:#4A576C; --line:#C3CBD8;
  --accent:#0B6B6B; --accent-ink:#FFFFFF; --accent-bg:#DDF0EF;
  --setup:#3545A8; --setup-bg:#E3E6F8; --period:#9A4D0A; --period-bg:#FBEAD6;
  --view:#43536B; --view-bg:#E2E7EF;
  --good:#1A7A48; --good-bg:#DCF2E5; --flag:#7D5200; --flag-bg:#FBF0CF;
  --font-display:'Rubik','Arial Hebrew','Segoe UI',Arial,sans-serif;
  --font-body:'IBM Plex Sans Hebrew','Arial Hebrew','Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141C; --panel:#18202B; --panel-2:#1D2633; --chrome:#263243;
  --title:#1B2535; --title-ink:#E7ECF3;
  --ink:#E7ECF3; --ink-2:#A3B0C2; --line:#35435A;
  --accent:#4CC2BF; --accent-ink:#06201F; --accent-bg:#123635;
  --setup:#A3AEFF; --setup-bg:#272E58; --period:#F2A65A; --period-bg:#45301B;
  --view:#B4C0D2; --view-bg:#2A3445;
  --good:#6AD39A; --good-bg:#173A29; --flag:#E5B85C; --flag-bg:#3D3115; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F141C; --panel:#18202B; --panel-2:#1D2633; --chrome:#263243;
  --title:#1B2535; --title-ink:#E7ECF3;
  --ink:#E7ECF3; --ink-2:#A3B0C2; --line:#35435A;
  --accent:#4CC2BF; --accent-ink:#06201F; --accent-bg:#123635;
  --setup:#A3AEFF; --setup-bg:#272E58; --period:#F2A65A; --period-bg:#45301B;
  --view:#B4C0D2; --view-bg:#2A3445;
  --good:#6AD39A; --good-bg:#173A29; --flag:#E5B85C; --flag-bg:#3D3115; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--title)}
h1,h2,h3{font-family:var(--font-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.75rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-family:var(--font-mono);font-size:.9em;unicode-bidi:isolate}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--title);color:var(--title-ink)}
.top-in{max-width:760px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-family:var(--font-display);font-size:1.05rem;font-weight:700}
.brand span{font-size:.82rem;opacity:.85;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:8px 14px;color:inherit;text-decoration:none;font-size:.95rem;border-radius:6px 6px 0 0;opacity:.82}
.nav a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
main{max-width:760px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.lead{font-size:1.08rem;color:var(--ink-2);max-width:60ch}

.search{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:13px 16px;font-size:1.05rem}
.search:focus{border-color:var(--accent);outline:none}

.k{display:inline-block;font-size:.8rem;font-weight:600;line-height:1.6;padding:0 9px;border-radius:999px;white-space:nowrap}
.k.setup{background:var(--setup-bg);color:var(--setup)}
.k.daily{background:var(--accent-bg);color:var(--accent)}
.k.view{background:var(--view-bg);color:var(--view)}
.k.period{background:var(--period-bg);color:var(--period)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.9rem;color:var(--ink-2)}

.tasks{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tasks a{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 2px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500}
.tasks li:last-child a{border-bottom:1px solid var(--line)}
.tasks a:hover{color:var(--accent)}
.tasks .en{color:var(--ink-2);font-weight:400;text-align:left;flex:none;max-width:48%;overflow-wrap:anywhere}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.scr{display:grid;gap:4px;align-content:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;text-decoration:none;color:var(--ink);min-width:0}
.scr:hover{border-color:var(--accent)}
.scr-h{display:flex;justify-content:space-between;gap:8px;align-items:start}
.scr b{font-family:var(--font-display);font-size:1.05rem;line-height:1.3}
.scr .en{color:var(--ink-2);font-size:.8rem;overflow-wrap:anywhere}
.scr p{font-size:.93rem;line-height:1.5;color:var(--ink-2)}
.scr .ok{color:var(--good);font-weight:700;flex:none}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.back{text-decoration:none;font-weight:500}
.win{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.win-t{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--title);color:var(--title-ink);padding:7px 11px;font:500 .86rem var(--font-mono);direction:ltr}
.win-t i{display:flex;gap:4px;flex:none}
.win-t i::before,.win-t i::after{content:"";width:9px;height:9px;border:1px solid currentColor;opacity:.6}
.win-b{background:var(--panel);padding:16px 16px 18px;display:grid;gap:8px}
.one{font-size:1.2rem;line-height:1.5;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.92rem;color:var(--ink-2)}
.sec{display:grid;gap:6px}
.sec h2{font-size:1.1rem}
.sec ol{margin:0;padding-inline-start:26px;display:grid;gap:6px}
.sec ol li::marker{font-family:var(--font-mono);color:var(--ink-2)}
.box{border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.box.grp{background:var(--setup-bg)}
.box.grp h2{color:var(--setup)}
.box.tip{background:var(--accent-bg)}
.box.tip h2{color:var(--accent)}
.box.v{background:var(--flag-bg);color:var(--flag);font-size:.93rem}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;direction:ltr;justify-content:flex-end;font:500 .84rem var(--font-mono)}
.crumbs span{background:var(--chrome);border:1px solid var(--line);border-radius:4px;padding:1px 8px}
.crumbs i{font-style:normal;color:var(--ink-2)}
.paths{display:grid;gap:8px}
.paths div{display:grid;gap:3px}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel a{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 13px;text-decoration:none;color:var(--ink);font-size:.95rem}
.rel a:hover{border-color:var(--accent);color:var(--accent)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn[aria-pressed="true"]{background:var(--good-bg);color:var(--good)}
.pn{display:flex;gap:14px;flex-wrap:wrap}
.pn a{text-decoration:none;font-weight:500}

.flow{display:grid;gap:10px}
.flow ol{list-style:none;margin:0;padding:0;counter-reset:fs;display:grid;gap:0}
.flow li{counter-increment:fs;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.flow li::before{content:counter(fs);font:500 .95rem var(--font-mono);color:var(--ink-2);background:var(--chrome);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;margin-top:2px}
.flow li a{font-weight:600;text-decoration:none}
.prose{display:grid;gap:10px;max-width:62ch}
.prose ul{margin:0;padding-inline-start:22px;display:grid;gap:4px}
@media (max-width:520px){ h1{font-size:1.5rem} .tasks .en{display:none} }
</style>
</head>
<body>
<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="top-in">
      <div class="brand"><b>מדריך המסכים</b><span id="prog"></span></div>
      <nav class="nav" id="nav" aria-label="ניווט ראשי">
        <a href="#home">כל המסכים</a>
        <a href="#flows">תהליכים</a>
        <a href="#about">דיוק ומקורות</a>
      </nav>
    </div>
  </header>
  <main id="main"></main>
</div>

<script>

 ['org','מבנה החברה והמחסנים','איך חברת האם, החברות הבנות והמחסנים שלהן מוגדרים במערכת.'],
 ['item','פריטים','איפה פריט נולד, ומה עובר ממנו מחברת האם לחברות הבנות.'],

   <section class="stack">
    <h1>כל מסך, במילים פשוטות</h1>
    <p class="lead">${SCREENS.length} המסכים המרכזיים של מלאי ותפ"י ב-Oracle EBS. לכל מסך: מה הוא עושה, מתי פותחים אותו, מה עושים בו ומה קורה אחר כך.</p>
    <input id="q" class="search" type="search" placeholder="חיפוש מסך, בעברית או באנגלית" aria-label="חיפוש מסך" value="${esc(query)}">
    <div id="res" aria-live="polite"></div>
   </section>
   <div id="rest" class="view"></div>
  </div>`;
  $('#q').oninput=e=>{query=e.target.value.trim(); drawHome();};
  drawHome();
}
function drawHome(){
  const res=$('#res'), rest=$('#rest');
  if(query.length>=2){
    const lq=query.toLowerCase();
    const hits=SCREENS.filter(s=>{
      const hay=[s.en,s.he,s.one,s.what].concat((s.paths||[]).map(p=>p[0])).join(' ');
      return hay.toLowerCase().indexOf(lq)>=0;
    });
    res.innerHTML=hits.length?`<p class="small muted">${hits.length} מסכים נמצאו</p><div class="grid">${hits.map(card).join('')}</div>`:'<p class="muted">לא נמצא מסך כזה במדריך. נסו מילה אחרת, או את שם המסך באנגלית.</p>';
    rest.hidden=true; return;
  }
  res.innerHTML=''; rest.hidden=false;
  rest.innerHTML=`
   <section class="stack">
    <h2>מה רוצים לעשות?</h2>
    <ul class="tasks">${TASKS.map(t=>`<li><a href="#s-${t[1]}"><span>${esc(t[0])}</span><span class="en" dir="ltr">${esc(BY[t[1]].en)}</span></a></li>`).join('')}</ul>
   </section>
   <section class="stack">
    <h2>כל המסכים, לפי תחום</h2>
    <p class="legend">${Object.keys(KINDS).map(k=>`<span>${kchip(k)} ${KINDS[k][1]}</span>`).join('')}</p>
   </section>
   ${GROUPS.map(g=>{const list=SCREENS.filter(s=>s.g===g[0]);return `<section class="stack" id="g-${g[0]}">
     <div class="group-h"><h2>${esc(g[1])}</h2><span class="small muted">${list.length} מסכים</span></div>
     <p class="muted">${esc(g[2])}</p>
     <div class="grid">${list.map(card).join('')}</div></section>`;}).join('')}
   <section class="stack">
    <h2>רוצים לרדת לרמת השדה?</h2>
    <p class="lead">המדריך הזה מסביר מסכים. האפליקציה השנייה, <a href="${TRAINER}" target="_blank" rel="noopener">מאמן המיישם</a>, מסבירה כל שדה וכל רשימת ערכים, ומתרגלת את ההורשה בין חברת האם לחברות הבנות.</p>
   </section>`;
}
function crumbs(p){return `<p class="crumbs">${p.split('>').map(x=>`<span>${esc(x.trim())}</span>`).join('<i>›</i>')}</p>`;}
function vScreen(s){
  const list=SCREENS.filter(x=>x.g===s.g), i=list.indexOf(s), prev=list[i-1], next=list[i+1];
  const g=GROUPS.find(x=>x[0]===s.g);
  const paths=s.paths?s.paths:[[s.en,s.path]];
  main.innerHTML=`<div class="view">
   <a class="back" href="#home">‹ כל המסכים</a>
   <div class="win">
    <div class="win-t"><span>${esc(s.en)}</span><i></i></div>
    <div class="win-b">
     <h1>${esc(s.he)}</h1>
     <p class="one">${fmt(s.one)}</p>
     <p class="meta">${kchip(s.k)}<span>${KINDS[s.k][1]}</span><span>מי עובד במסך: ${esc(s.who)}</span><span>תחום: ${esc(g[1])}</span></p>
    </div>
   </div>
   <section class="sec"><h2>מה המסך עושה</h2><p>${fmt(s.what)}</p></section>
   <section class="sec"><h2>מתי פותחים אותו</h2><p>${fmt(s.when)}</p></section>
   <section class="sec"><h2>מה עושים בו</h2><ol>${s.steps.map(x=>`<li>${fmt(x)}</li>`).join('')}</ol></section>
   <section class="sec"><h2>מה קורה אחר כך</h2><p>${fmt(s.after)}</p></section>
   ${s.grp?`<section class="box grp"><h2>בקבוצת חברות</h2><p>${fmt(s.grp)}</p></section>`:''}
   ${s.tip?`<section class="box tip"><h2>כדאי לדעת</h2><p>${fmt(s.tip)}</p></section>`:''}
   <section class="sec"><h2>איפה בתפריט</h2>
    <p class="small muted">מודול: ${esc(MODS[s.mod])}. הנתיב לפי מדריך המשתמש. התפריט אצלכם תלוי בהרשאות שהוגדרו לכם.</p>
    <div class="paths">${paths.map(p=>`<div>${paths.length>1?`<span class="en small" dir="ltr">${esc(p[0])}</span>`:''}${crumbs(p[1])}</div>`).join('')}</div>
   </section>
   ${s.v?`<section class="box v"><p><b>לאמת:</b> ${fmt(s.v)}</p></section>`:''}
   <section class="sec"><h2>מסכים קשורים</h2><div class="rel">${(s.rel||[]).map(id=>`<a href="#s-${id}">${esc(BY[id].he)}</a>`).join('')}</div></section>
   <div class="foot">
    <button class="btn" id="mark" aria-pressed="${!!READ[s.id]}">${READ[s.id]?'✓ סומן שהבנתי':'הבנתי את המסך'}</button>
    <span class="pn">${prev?`<a href="#s-${prev.id}">‹ ${esc(prev.he)}</a>`:''}${next?`<a href="#s-${next.id}">${esc(next.he)} ›</a>`:''}</span>
   </div>
  </div>`;
  $('#mark').onclick=()=>{ if(READ[s.id]) delete READ[s.id]; else READ[s.id]=1; save(); vScreen(s); };
}
function vFlows(){
  main.innerHTML=`<div class="view">
   <section class="stack"><h1>תהליכים</h1>
    <p class="lead">מסך לבדו לא מספר את כל הסיפור. כאן רואים איך המסכים מתחברים לתהליך שלם, צעד אחרי צעד.</p></section>
   ${FLOWS.map(f=>`<section class="flow"><h2>${esc(f.t)}</h2><p class="muted">${esc(f.d)}</p>
     <ol>${f.s.map(x=>`<li><div><a href="#s-${x[0]}">${esc(BY[x[0]].he)}</a> <span class="en small muted" dir="ltr">${esc(BY[x[0]].en)}</span><br>${esc(x[1])}</div></li>`).join('')}</ol></section>`).join('')}
  </div>`;
}
function vAbout(){
  const flagged=SCREENS.filter(s=>s.v).length;
  main.innerHTML=`<div class="view">
   <section class="prose"><h1>דיוק ומקורות</h1>
    <p>המדריך נבנה ללימוד עצמי של ${en('Oracle E-Business Suite R12')}, הגרסה שעובדת עם מסכי Forms. הוא אינו מוצר רשמי של Oracle, ואינו מחליף את התיעוד הרשמי או את המערכת שלכם.</p></section>
   <section class="prose"><h2>מה נבדק</h2>
    <p>שמות המסכים ונתיבי התפריט נלקחו מנספחי הניווט של מדריכי המשתמש הרשמיים של גרסה 12.2, בנובמבר 2026. גם ההסבר על מה שכל מסך עושה נבדק מול אותם מדריכים, ברוב המסכים.</p>
    <ul>
     <li>${en("Oracle Inventory User's Guide")} (${en('E48820')})</li>
     <li>${en("Oracle Bills of Material User's Guide")} (${en('E48954')})</li>
     <li>${en("Oracle Work in Process User's Guide")} (${en('E48905')})</li>
     <li>${en("Oracle MRP User's Guide")} (${en('E48795')})</li>
    </ul>
    <p>ספריית התיעוד של גרסה 12.2: <a href="https://docs.oracle.com/cd/E26401_01/index.htm" target="_blank" rel="noopener">docs.oracle.com/cd/E26401_01</a></p></section>
   <section class="prose"><h2>מה לא נבדק</h2>
    <ul>
     <li>ב-${flagged} מתוך ${SCREENS.length} המסכים מופיעה הערת "לאמת", שמסבירה מה בדיוק לא נבדק.</li>
     <li>הצעדים שבסעיף "מה עושים בו" הם סיכום פשוט שלי, ולא רשימת שדות מדויקת. במסך האמיתי יש בדרך כלל שדות ואפשרויות נוספים.</li>
     <li>העמודה "מי עובד במסך" מתארת חלוקת תפקידים טיפוסית. אצלכם היא עשויה להיות שונה.</li>
     <li>המערכת שלכם עצמה: גרסה מדויקת, התאמות מקומיות, תרגום לעברית והרשאות.</li>
    </ul></section>
   <section class="prose"><h2>הסימונים שלכם</h2>
    <p>הסימון "הבנתי את המסך" נשמר בדפדפן הזה בלבד. הוא לא עובר למכשיר אחר, ועלול להימחק אם מנקים את נתוני הדפדפן.</p>
    <div id="reset-box"><button class="btn" id="reset">ניקוי הסימונים</button></div></section>
  </div>`;
  $('#reset').onclick=()=>{
    $('#reset-box').innerHTML='<span>לנקות את כל הסימונים?</span> <button class="btn" id="ry">כן, לנקות</button> <button class="btn" id="rn" aria-pressed="true">ביטול</button>';
    $('#ry').onclick=()=>{READ={}; save(); vAbout();};
    $('#rn').onclick=vAbout;
  };
}
function route(){
  const h=(location.hash||'').replace('#','');
  let tab='home';
  if(h==='flows'){tab='flows'; vFlows();}
  else if(h==='about'){tab='about'; vAbout();}
  else if(h.indexOf('s-')===0&&BY[h.slice(2)]){vScreen(BY[h.slice(2)]);}
  else vHome();
  $$('#nav a').forEach(a=>{ if(a.getAttribute('href')==='#'+tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
drawProg(); route();
})();
</script>
</body>
</html>
