        const numberData = [
            { number: 1, name: 'אחד' },
            { number: 2, name: 'שניים' },
            { number: 3, name: 'שלושה' },
            { number: 4, name: 'ארבעה' },
            { number: 5, name: 'חמישה' },

            { number: 7, name: 'שבעה' },

        // Initialize app
        window.onload = function() {
            // Load photos
            try {
                const savedPhotos = localStorage.getItem('userPhotos');
                if (savedPhotos) {
                    userPhotos = JSON.parse(savedPhotos);
                    renderPhotos();
                }
            } catch (error) {
                console.error('Error loading photos:', error);
            }
            
            // Setup letters grid
            setupLettersGrid();
            
            // Setup numbers grid
            setupNumbersGrid();
        };
        
        // Navigation functions
        function showScreen(screenId) {
            // Hide all screens
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            
            // Show requested screen
            document.getElementById(screenId).classList.add('active');
        }
        
        // Photo handling
        function handleFileSelect(event) {
            const files = event.target.files;
            
            if (files && files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    
                    if (file.type.match('image.*')) {
                        const reader = new FileReader();
                        
                        reader.onload = function(e) {
                            const photoId = Date.now() + i;
                            userPhotos.push({
                                id: photoId,
                                src: e.target.result,
                                name: file.name
                            });
                            
                            // Save to localStorage
                            try {
                                localStorage.setItem('userPhotos', JSON.stringify(userPhotos));
                                renderPhotos();
                            } catch (error) {
                                console.error('Error saving to localStorage:', error);
                                alert('שגיאה בשמירת התמונות');
                            }
                        };
                        
                        reader.readAsDataURL(file);
                    }
                }
            }
        }
        
        function renderPhotos() {
            const photosGrid = document.getElementById('photos-grid');
            if (!photosGrid) return;
            
            photosGrid.innerHTML = '';
            
            if (userPhotos.length === 0) {
                photosGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">אין תמונות עדיין</p>';
                return;
            }
            
            userPhotos.forEach(photo => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                
                const img = document.createElement('img');
                img.src = photo.src;
                img.alt = photo.name || 'תמונה';
                
                const removeButton = document.createElement('button');
                removeButton.className = 'remove-photo';
                removeButton.innerHTML = '×';
                removeButton.onclick = function() {
                    removePhoto(photo.id);
                };
                
                photoItem.appendChild(img);
                photoItem.appendChild(removeButton);
                photosGrid.appendChild(photoItem);
            });
        }
        
        function removePhoto(photoId) {
            userPhotos = userPhotos.filter(photo => photo.id !== photoId);
            
            // Save to localStorage
            try {
                localStorage.setItem('userPhotos', JSON.stringify(userPhotos));
                renderPhotos();
            } catch (error) {
                console.error('Error saving after removal:', error);
                alert('שגיאה בהסרת התמונה');
            }
        }
        
        // Letters functions
        function setupLettersGrid() {
            const lettersGrid = document.getElementById('letters-grid');
            if (!lettersGrid) return;
            
            lettersGrid.innerHTML = '';
            
            // Load letter images
            let letterImages = {};
            try {
                const savedImages = localStorage.getItem('letterImages');
                if (savedImages) {
                    letterImages = JSON.parse(savedImages);
                }
            } catch (error) {
                console.error('Error loading letter images:', error);
            }
            
            // Create a tile for each letter
            hebrewLetters.forEach(letterData => {
                const tile = document.createElement('div');
                tile.className = 'item-tile';
                
                // Letter label
                const label = document.createElement('div');
                label.className = 'item-label';
                label.textContent = letterData.letter;
                tile.appendChild(label);
                
                // Image preview
                const imgContainer = document.createElement('div');
                imgContainer.className = 'image-preview';
                
                const img = document.createElement('img');
                
                // Check if we have a saved image for this letter
                if (letterImages[letterData.letter]) {
                    img.src = letterImages[letterData.letter];
                } else {
                    img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgZmlsbC1ydWxlPSJldmVub2RkIiBjbGlwLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0xMiAwYzYuNjIzIDAgMTIgNS4zNzcgMTIgMTJzLTUuMzc3IDEyLTEyIDEyLTEyLTUuMzc3LTEyLTEyIDUuMzc3LTEyIDEyLTEyek0xMi45IDE5aC0xLjh2LTJoMS44djJ6bTAtNGgtMS44di03LjVoMS44djcuNXoiLz48L3N2Zz4=';
                    img.style.padding = '15px';
                    img.style.boxSizing = 'border-box';
                    img.style.background = '#f0f0f0';
                }
                
                imgContainer.appendChild(img);
                tile.appendChild(imgContainer);
                
                // Set button
                const setButton = document.createElement('button');
                setButton.className = 'upload-button';
                setButton.style.margin = '10px auto 0';
                setButton.style.padding = '5px 10px';
                setButton.style.fontSize = '14px';
                setButton.textContent = 'בחר תמונה';
                setButton.onclick = function() {
                    openPhotoModal(letterData.letter, 'letter');
                };
                
                tile.appendChild(setButton);
                lettersGrid.appendChild(tile);
            });
        }
        
        function startLettersLearning() {
            document.getElementById('letters-grid').parentNode.style.display = 'none';
            document.getElementById('letters-learning').style.display = 'block';
            updateLetterDisplay();
        }
        
        function backToLettersSettings() {
            document.getElementById('letters-grid').parentNode.style.display = 'block';
            document.getElementById('letters-learning').style.display = 'none';
        }
        
        function navigateLetters(direction) {
            currentLetterIndex = (currentLetterIndex + direction + hebrewLetters.length) % hebrewLetters.length;
            updateLetterDisplay();
        }
        
        function updateLetterDisplay() {
            const letterData = hebrewLetters[currentLetterIndex];
            document.getElementById('letter-display').textContent = letterData.letter;
            document.getElementById('letter-name').textContent = letterData.name;
            document.getElementById('letter-examples').textContent = letterData.examples;
            
            // Update image
            let letterImages = {};
            try {
                const savedImages = localStorage.getItem('letterImages');
                if (savedImages) {
                    letterImages = JSON.parse(savedImages);
                }
            } catch (error) {
                console.error('Error loading letter images:', error);
            }
            
            const img = document.getElementById('letter-image');
            if (letterImages[letterData.letter]) {
                img.src = letterImages[letterData.letter];
                img.style.padding = '0';
                img.style.background = 'none';
            } else {
                img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgZmlsbC1ydWxlPSJldmVub2RkIiBjbGlwLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0xMiAwYzYuNjIzIDAgMTIgNS4zNzcgMTIgMTJzLTUuMzc3IDEyLTEyIDEyLTEyLTUuMzc3LTEyLTEyIDUuMzc3LTEyIDEyLTEyek0xMi45IDE5aC0xLjh2LTJoMS44djJ6bTAtNGgtMS44di03LjVoMS44djcuNXoiLz48L3N2Zz4=';
                img.style.padding = '50px';
                img.style.boxSizing = 'border-box';
                img.style.background = '#f0f0f0';
            }
        }
        
        // Numbers functions
        function setupNumbersGrid() {
            const numbersGrid = document.getElementById('numbers-grid');
            if (!numbersGrid) return;
            
            numbersGrid.innerHTML = '';
            
            // Load number images
            let numberImages = {};
            try {
                const savedImages = localStorage.getItem('numberImages');
                if (savedImages) {
                    numberImages = JSON.parse(savedImages);
                }
            } catch (error) {
                console.error('Error loading number images:', error);
            }
            
            // Create a tile for each number
            numberData.forEach(numData => {
                const tile = document.createElement('div');
                tile.className = 'item-tile';
                
                // Number label
                const label = document.createElement('div');
                label.className = 'item-label';
                label.textContent = numData.number;
                tile.appendChild(label);
                
                // Image preview
                const imgContainer = document.createElement('div');
                imgContainer.className = 'image-preview';
                
                const img = document.createElement('img');
                
                // Check if we have a saved image for this number
                if (numberImages[numData.number]) {
                    img.src = numberImages[numData.number];
                } else {
                    img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgZmlsbC1ydWxlPSJldmVub2RkIiBjbGlwLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0xMiAwYzYuNjIzIDAgMTIgNS4zNzcgMTIgMTJzLTUuMzc3IDEyLTEyIDEyLTEyLTUuMzc3LTEyLTEyIDUuMzc3LTEyIDEyLTEyek0xMi45IDE5aC0xLjh2LTJoMS44djJ6bTAtNGgtMS44di03LjVoMS44djcuNXoiLz48L3N2Zz4=';
                    img.style.padding = '15px';
                    img.style.boxSizing = 'border-box';
                    img.style.background = '#f0f0f0';
                }
                
                imgContainer.appendChild(img);
                tile.appendChild(imgContainer);
                
                // Set button
                const setButton = document.createElement('button');
                setButton.className = 'upload-button';
                setButton.style.margin = '10px auto 0';
                setButton.style.padding = '5px 10px';
                setButton.style.fontSize = '14px';
                setButton.textContent = 'בחר תמונה';
                setButton.onclick = function() {
                    openPhotoModal(numData.number, 'number');
                };
                
                tile.appendChild(setButton);
                numbersGrid.appendChild(tile);
            });
        }
        
        function startNumbersLearning() {
            document.getElementById('numbers-grid').parentNode.style.display = 'none';
            document.getElementById('numbers-learning').style.display = 'block';
            updateNumberDisplay();
        }
        
        function backToNumbersSettings() {
            document.getElementById('numbers-grid').parentNode.style.display = 'block';
            document.getElementById('numbers-learning').style.display = 'none';
        }
        
        function navigateNumbers(direction) {
            currentNumberIndex = (currentNumberIndex + direction + numberData.length) % numberData.length;
            updateNumberDisplay();
        }
        
        function updateNumberDisplay() {
            const numData = numberData[currentNumberIndex];
            document.getElementById('number-display').textContent = numData.number;
            document.getElementById('number-name').textContent = numData.name;
            
            // Update image
            let numberImages = {};
            try {
                const savedImages = localStorage.getItem('numberImages');
                if (savedImages) {
                    numberImages = JSON.parse(savedImages);
                }
            } catch (error) {
                console.error('Error loading number images:', error);
            }
            
            const img = document.getElementById('number-image');
            if (numberImages[numData.number]) {
                img.src = numberImages[numData.number];
                img.style.padding = '0';
                img.style.background = 'none';
            } else {
                img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgZmlsbC1ydWxlPSJldmVub2RkIiBjbGlwLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0xMiAwYzYuNjIzIDAgMTIgNS4zNzcgMTIgMTJzLTUuMzc3IDEyLTEyIDEyLTEyLTUuMzc3LTEyLTEyIDUuMzc3LTEyIDEyLTEyek0xMi45IDE5aC0xLjh2LTJoMS44djJ6bTAtNGgtMS44di03LjVoMS44djcuNXoiLz48L3N2Zz4=';
                img.style.padding = '50px';
                img.style.boxSizing = 'border-box';
                img.style.background = '#f0f0f0';
            }
        }
        
        // Photo modal functions
        function openPhotoModal(item, type) {
            currentItem = item;
            currentItemType = type;
            
            // Set modal title
            if (type === 'letter') {
                document.getElementById('modal-title').textContent = 'בחר תמונה לאות ' + item;
            } else {
                document.getElementById('modal-title').textContent = 'בחר תמונה למספר ' + item;
            }
            
            // Fill photo selection
            const photoSelection = document.getElementById('photo-selection');
            photoSelection.innerHTML = '';
            
            if (userPhotos.length === 0) {
                photoSelection.innerHTML = '<p>אין תמונות עדיין. נא להעלות תמונות דרך מסך "ניהול תמונות".</p>';
            } else {
                userPhotos.forEach(photo => {
                    const img = document.createElement('img');
                    img.src = photo.src;
                    img.alt = photo.name || 'תמונה';
                    img.onclick = function() {
                        selectPhotoForItem(photo.src);
                    };
                    photoSelection.appendChild(img);
                });
            }
            
            // Show modal
            document.getElementById('photo-modal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('photo-modal').style.display = 'none';
        }
        
        function selectPhotoForItem(imageSrc) {
            if (currentItemType === 'letter') {
                saveLetterImage(currentItem, imageSrc);
                setupLettersGrid(); // Refresh letters grid
            } else {
                saveNumberImage(currentItem, imageSrc);
                setupNumbersGrid(); // Refresh numbers grid
            }
            
            closeModal();
        }
        
        function saveLetterImage(letter, imageSrc) {
            try {
                let letterImages = {};
                const savedImages = localStorage.getItem('letterImages');
                if (savedImages) {
                    letterImages = JSON.parse(savedImages);
                }
                
                letterImages[letter] = imageSrc;
                localStorage.setItem('letterImages', JSON.stringify(letterImages));
            } catch (error) {
                console.error('Error saving letter image:', error);
                alert('שגיאה בשמירת התמונה');
            }
        }
        
        function saveNumberImage(number, imageSrc) {
            try {
                let numberImages = {};
                const savedImages = localStorage.getItem('numberImages');
                if (savedImages) {
                    numberImages = JSON.parse(savedImages);
                }
                
                numberImages[number] = imageSrc;
                localStorage.setItem('numberImages', JSON.stringify(numberImages));
            } catch (error) {
                console.error('Error saving number image:', error);
                alert('שגיאה בשמירת התמונה');
            }
        }
    </script>
