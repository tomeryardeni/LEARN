<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מאמן מיישם Oracle EBS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: sticky title bar with folder-tab navigation, one reading column (max 940px).
   The Oracle Forms mock is an LTR "window" set inside the RTL Hebrew page.
   Master = indigo and Org = amber wherever the two control levels appear. */
:root{
  --bg:#ECEFF4; --panel:#FFFFFF; --panel-2:#F3F5F9; --chrome:#DCE2EB; --shade:#C9D1DD;
  --title:#22304A; --title-ink:#F2F5FA;
  --ink:#162032; --ink-2:#4A576C; --line:#C3CBD8;
  --accent:#0B6B6B; --accent-ink:#FFFFFF; --accent-bg:#DDF0EF;
  --master:#3545A8; --master-bg:#E3E6F8; --org:#9A4D0A; --org-bg:#FBEAD6;
  --req:#FFF3B0; --good:#1A7A48; --good-bg:#DCF2E5; --bad:#B3261E; --bad-bg:#FBE0DD;
  --flag:#7D5200; --flag-bg:#FBF0CF;
  --font-display:'Rubik','Arial Hebrew','Segoe UI',Arial,sans-serif;
  --font-body:'IBM Plex Sans Hebrew','Arial Hebrew','Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141C; --panel:#18202B; --panel-2:#1D2633; --chrome:#263243; --shade:#111821;
  --title:#1B2535; --title-ink:#E7ECF3;
  --ink:#E7ECF3; --ink-2:#A3B0C2; --line:#35435A;
  --accent:#4CC2BF; --accent-ink:#06201F; --accent-bg:#123635;
  --master:#A3AEFF; --master-bg:#272E58; --org:#F2A65A; --org-bg:#45301B;
  --req:#4F4619; --good:#6AD39A; --good-bg:#173A29; --bad:#FF8A80; --bad-bg:#4A1F1C;
  --flag:#E5B85C; --flag-bg:#3D3115; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F141C; --panel:#18202B; --panel-2:#1D2633; --chrome:#263243; --shade:#111821;
  --title:#1B2535; --title-ink:#E7ECF3;
  --ink:#E7ECF3; --ink-2:#A3B0C2; --line:#35435A;
  --accent:#4CC2BF; --accent-ink:#06201F; --accent-bg:#123635;
  --master:#A3AEFF; --master-bg:#272E58; --org:#F2A65A; --org-bg:#45301B;
  --req:#4F4619; --good:#6AD39A; --good-bg:#173A29; --bad:#FF8A80; --bad-bg:#4A1F1C;
  --flag:#E5B85C; --flag-bg:#3D3115; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--title)}
h1,h2,h3{font-family:var(--font-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.en{font-family:var(--font-mono);font-size:.9em;unicode-bidi:isolate}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--title);color:var(--title-ink)}
.top-in{max-width:940px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-family:var(--font-display);font-size:1.05rem;font-weight:700}
.brand span{font-size:.8rem;opacity:.85;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:7px 13px;color:inherit;text-decoration:none;font-size:.92rem;border-radius:6px 6px 0 0;opacity:.82}
.nav a:hover{opacity:1}
.nav a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
main{max-width:940px;margin:0 auto;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:22px;min-width:0}
.view>*{min-width:0}
.lead{max-width:65ch;color:var(--ink-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.stack{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.stack>*{min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>*{min-width:0}
.row>select{flex:1 1 240px}
.row>input[type=search]{flex:1 1 200px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:.86rem}
select,input[type=search],input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}

.b{display:inline-block;font:500 .72rem/1.5 var(--font-mono);padding:0 6px;border-radius:4px;white-space:nowrap}
.b.m{background:var(--master-bg);color:var(--master)}
.b.o{background:var(--org-bg);color:var(--org)}
.b.g{background:var(--accent-bg);color:var(--accent)}
.b.f{background:var(--flag-bg);color:var(--flag);font-family:var(--font-body)}

/* ---------- home ---------- */
.hero h1{margin-bottom:6px}
.path{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:st}
.path li{counter-increment:st;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.path li:last-child{border-bottom:1px solid var(--line)}
.path li::before{content:counter(st);font:500 1rem var(--font-mono);color:var(--ink-2);text-align:center}
.path h3{margin-bottom:2px}
.bar{height:5px;background:var(--chrome);border-radius:3px;overflow:hidden;margin-top:7px;max-width:260px}
.bar i{display:block;height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.stat b{display:block;font:700 1.35rem var(--font-display);font-variant-numeric:tabular-nums}
.conv{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.conv li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start}
.key{font:500 .78rem/1.6 var(--font-mono);background:var(--chrome);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;text-align:center;direction:ltr}
.key.y{background:var(--req)}

/* ---------- forms window ---------- */
.fw{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--chrome)}
.fw-title{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--title);color:var(--title-ink);padding:6px 10px;font:500 .8rem var(--font-mono);direction:ltr}
.fw-title i{display:flex;gap:4px;flex:none}
.fw-title i::before,.fw-title i::after{content:"";width:9px;height:9px;border:1px solid currentColor;opacity:.6}
.fw-tabs{display:flex;gap:2px;padding:8px 8px 0;overflow-x:auto;direction:ltr}
.fw-tabs button{flex:none;border:1px solid var(--line);border-bottom:0;background:transparent;padding:5px 10px;border-radius:5px 5px 0 0;font:500 .78rem var(--font-mono);color:var(--ink-2)}
.fw-tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
.fw-body{background:var(--panel-2);margin:0 8px;border:1px solid var(--line);padding:10px;display:grid;gap:3px}
.fw-status{direction:ltr;font:400 .72rem var(--font-mono);color:var(--ink-2);padding:5px 10px;display:flex;gap:18px;min-height:26px}
.fr{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:8px;align-items:center;direction:ltr;width:100%;background:none;border:0;padding:3px 4px;border-radius:4px;text-align:left}
.fr:hover,.fr[aria-expanded="true"]{background:var(--chrome)}
.fl{font:500 .8rem/1.35 var(--font-mono);text-align:right;overflow-wrap:anywhere}
.fl.seen::before{content:"✓ ";color:var(--good)}
.fc{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:28px;background:var(--panel);border:1px solid var(--line);padding:2px 8px;font:400 .8rem/1.35 var(--font-mono);box-shadow:inset 1px 1px 0 var(--shade);overflow-wrap:anywhere;min-width:0}
.fc.req{background:var(--req)}
.fc.c{background:none;border:0;box-shadow:none;justify-content:flex-start;padding-inline:0}
.dots{flex:none;border:1px solid var(--line);background:var(--chrome);padding:0 5px;font-size:.7rem;line-height:16px}
.chk{width:15px;height:15px;border:1px solid var(--ink-2);background:var(--panel);display:inline-grid;place-items:center;font-size:11px;line-height:1}
.fd{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:2px 0 8px;display:grid;gap:8px}
.fd-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lovl{margin:0;display:grid;gap:4px}
.lovl div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;padding:4px 0;border-top:1px dashed var(--line)}
.lovl dt{font:500 .8rem/1.5 var(--font-mono);direction:ltr;text-align:left;overflow-wrap:anywhere}
.lovl dd{margin:0;font-size:.9rem}
.tip{background:var(--accent-bg);border-radius:6px;padding:8px 10px;font-size:.92rem}
.tip b{color:var(--accent)}
.vnote{background:var(--flag-bg);color:var(--flag);border-radius:6px;padding:6px 10px;font-size:.86rem}
.pathline{font:400 .8rem var(--font-mono);direction:ltr;text-align:right;color:var(--ink-2);overflow-wrap:anywhere}
.results{display:grid;gap:4px}
.results button{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;text-align:start}

/* ---------- inheritance ---------- */
.levels{display:grid;gap:6px}
.lvl{margin-inline-start:calc(var(--i)*13px);border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 12px;display:grid;gap:2px}
.lvl-h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.lvl-h b{font-family:var(--font-display)}
.tree{display:grid;gap:0;justify-items:center}
.tree-kids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;position:relative;padding-top:18px}
.tree-kids::before{content:"";position:absolute;top:8px;inset-inline:16.6%;border-top:2px solid var(--line)}
.stem{width:2px;height:8px;background:var(--line)}
.node{position:relative;width:100%;border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 6px;text-align:center;display:grid;gap:0;line-height:1.3}
.tree-kids .node::before{content:"";position:absolute;top:-12px;inset-inline-start:50%;width:2px;height:10px;background:var(--line)}
.node b{font:500 .95rem var(--font-mono)}
.node span{font-size:.82rem}
.node small{font-size:.72rem;color:var(--ink-2)}
.node.m{max-width:220px;border-color:var(--master)}
.node[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent)}
.node.off{border-style:dashed}
.simrow{display:grid;gap:5px;padding:9px 0;border-top:1px solid var(--line)}
.simrow-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.simrow-h label{font:500 .84rem var(--font-mono);direction:ltr}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--panel);padding:2px 9px;font:500 .74rem var(--font-mono);color:var(--ink-2)}
.seg button[aria-pressed="true"].sm-m{background:var(--master-bg);color:var(--master)}
.seg button[aria-pressed="true"].sm-o{background:var(--org-bg);color:var(--org)}
.simctl{width:100%;direction:ltr;font:400 .86rem var(--font-mono);background:var(--panel);border:1px solid var(--line);border-radius:0;padding:5px 8px;box-shadow:inset 1px 1px 0 var(--shade);text-align:left}
.simctl.lock{background:var(--chrome);color:var(--ink-2);box-shadow:none}
.vchips{display:flex;flex-wrap:wrap;gap:4px;direction:ltr;justify-content:flex-end}
.vchip{font:400 .72rem/1.6 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--panel-2)}
.vchip.diff{border-color:var(--org);color:var(--org)}
.vchip.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:var(--req)}100%{background:var(--panel-2)}}
.log{min-height:3.2em;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.92rem}
.mis{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mis li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.mis .box{width:18px;height:18px;border:2px solid var(--ink-2);border-radius:4px;margin-top:4px;display:grid;place-items:center;font-size:12px;line-height:1}
.mis li.done .box{background:var(--good);border-color:var(--good);color:var(--panel)}
.mis li.done p{color:var(--ink-2)}
.mis details{font-size:.86rem;color:var(--ink-2)}
.shared{display:grid;gap:0}
.shared div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.shared .b{margin-top:3px;text-align:center;font-family:var(--font-body);white-space:normal}

/* ---------- practice ---------- */
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px;direction:ltr}
.match>div{display:grid;gap:6px;align-content:start}
.mi{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 9px;min-height:44px;text-align:start;line-height:1.35}
.mi.v{font:500 .82rem/1.35 var(--font-mono);direction:ltr;text-align:left;overflow-wrap:anywhere}
.mi.h{direction:rtl;font-size:.9rem}
.mi[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.mi.ok{border-color:var(--good);background:var(--good-bg);color:var(--good);cursor:default}
.mi.no{border-color:var(--bad);background:var(--bad-bg)}
.fcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:22px 18px;min-height:230px;display:grid;gap:10px;align-content:center;text-align:center}
.fcard .big{font:500 1.35rem/1.3 var(--font-mono);direction:ltr;overflow-wrap:anywhere}
.fcard .back{text-align:start;display:grid;gap:8px}
.boxes{display:flex;gap:6px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2)}
.q-opts{display:grid;gap:8px}
.q-opts button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;text-align:start;line-height:1.45}
.q-opts button.ok{border-color:var(--good);background:var(--good-bg)}
.q-opts button.no{border-color:var(--bad);background:var(--bad-bg)}
.q-opts button:disabled{cursor:default;opacity:1;color:var(--ink)}
.q-text{font-size:1.08rem;font-weight:500;max-width:65ch}
.q-text q{display:block;margin-top:6px;font-weight:400;color:var(--ink-2)}
.q-exp{border-radius:8px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line)}
.q-exp.ok{border-color:var(--good)} .q-exp.no{border-color:var(--bad)}

/* ---------- glossary / about ---------- */
.gl{display:grid;gap:0}
.gl div{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.gl dt{font:500 .86rem/1.5 var(--font-mono);direction:ltr;text-align:left;overflow-wrap:anywhere}
.gl dd{margin:0}
.gl dd b{font-weight:600}
.prose{display:grid;gap:10px;max-width:68ch}
.prose ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 14px;font-size:.92rem;z-index:20;text-align:center}
@media (max-width:520px){
  .path li{grid-template-columns:26px minmax(0,1fr)}
  .path li .btn{grid-column:2;justify-self:start}
  .shared div{grid-template-columns:1fr;gap:4px}
  .shared .b{justify-self:start}
  .conv li{grid-template-columns:78px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.vchip.flash{animation:none}}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="top-in">
      <div class="brand"><b>מאמן המיישם</b><span id="prog"></span></div>
      <nav class="nav" id="nav" aria-label="ניווט ראשי">
        <a href="#home">בית</a>
        <a href="#inherit">מבנה והורשה</a>
        <a href="#screens">מסכים ושדות</a>
        <a href="#practice">תרגול</a>
        <a href="#glossary">מילון</a>
        <a href="#about">דיוק ומקורות</a>
      </nav>
    </div>
  </header>
  <main id="main"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script>
(function(){
'use strict';
document.documentElement.lang='he'; document.documentElement.dir='rtl';

/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* data strings mark English terms with `backticks` */
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<span class="en" dir="ltr">$1</span>');
const en=s=>'<span class="en" dir="ltr">'+esc(s)+'</span>';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');

/* ================= content ================= */
const MODS={org:'מבנה ארגוני והורשה',inv:'מלאי ופריטים',bom:'עצי מוצר ומסלולים',wip:'פקודות עבודה',mrp:'תכנון'};

const L_SUPPLY=[
 ['Push','ניפוק ידני של הרכיב לפקודה'],
 ['Assembly Pull','ניפוק אוטומטי כשמדווחים גמר של המכלול'],
 ['Operation Pull','ניפוק אוטומטי כשמשלימים את הפעולה במסלול'],
 ['Bulk','לא מנופק לפקודה: חומר רצפה כללי, כמו ברגים ודבק'],
 ['Supplier','הספק או קבלן המשנה מביא את הרכיב'],
 ['Phantom','מכלול מדומה: רכיביו נפתחים ישר לפקודת האב']];
const L_SRC=[
 ['Inventory','מילוי מארגון אחר, דרך דרישה פנימית'],
 ['Supplier','מילוי מספק, דרך דרישת רכש'],
 ['Subinventory','מילוי ממחסן משנה אחר באותו ארגון']];
const L_TF=[
 ['Cumulative mfg. lead time','לפי זמן הייצור המצטבר של הפריט'],
 ['Cumulative total lead time','לפי זמן האספקה המצטבר הכולל, כולל רכש'],
 ['Total lead time','לפי זמן האספקה של הפריט עצמו'],

function setVal(id,val){
  const a=ATTRS.find(x=>x.id===id), o=sim.org;

    ORGS.forEach(r=>{if(sim.on[r[0]]) flash[id+r[0]]=1;});
    sim.log=`עדכנתם את ${en(a.n)} בחברת האם. המאפיין נשלט ברמת Master, ולכן הערך החדש חל מיד גם על ${others.join(', ')}.`;
    if(id==='desc') mission('m1');
  } else {
    flash[id+o]=1;
    sim.log=`עדכנתם את ${en(a.n)} ב-${en(o)} בלבד. המאפיין נשלט ברמת Org, ולכן שאר החברות לא השתנו.`;

}

let M=null;
function startMatch(id){

  box.innerHTML=`

    <div>${M.hes.map(v=>`<button class="mi h ${M.ok[v[0]]?'ok':''} ${M.bad===v[0]?'no':''}" data-h="${esc(v[0])}" ${M.ok[v[0]]?'disabled':''}>${fmt(v[1])}</button>`).join('')}</div>
   </div>
   <div class="row" role="status" aria-live="polite">${fin?`<b>${M.miss?'הושלם, עם '+M.miss+' טעויות.':'הושלם בלי טעויות.'}</b> <button class="btn" id="m-next">הרשימה הבאה</button>`:`<span class="muted small">${n}/${f.lov.length} התאמות</span>`}</div>`;
  M.bad=null;
  $('#m-pick').onchange=e=>startMatch(e.target.value);
  $$('[data-v]',box).forEach(b=>b.onclick=()=>{M.sel=b.dataset.v; drawMatch();});
  $$('[data-h]',box).forEach(b=>b.onclick=()=>{
    if(!M.sel){toast('בחרו קודם ערך מהעמודה השמאלית');return;}

      if(Object.keys(M.ok).length===M.x.f.lov.length){S.lov[M.x.id]=1; S.seen[M.x.id]=1; save();}
    } else {M.miss++; M.bad=b.dataset.h;}
    drawMatch();
  });
  const nx=$('#m-next'); if(nx) nx.onclick=()=>startMatch();

function nextCard(){
  const pool=cardPool(); const min=Math.min.apply(null,pool.map(x=>S.box[x.id]||0));
  let cand=pool.filter(x=>(S.box[x.id]||0)===min&&x.id!==C.id); if(!cand.length) cand=pool;
  C.id=pick(cand).id; C.flip=false;
}
function drawCards(){
  const box=$('#prac'); if(!box) return;
  if(!C.id||!BYID[C.id]||(C.mod!=='all'&&BYID[C.id].scr.mod!==C.mod)) nextCard();
  const x=BYID[C.id], f=x.f, pool=cardPool();
  const cnt=[0,1,2,3].map(b=>pool.filter(p=>(S.box[p.id]||0)===b).length);
  box.innerHTML=`
   <p class="lead">נסו להיזכר מה השדה עושה, ואז הפכו את הכרטיסייה. כרטיסייה שידעתם שלוש פעמים נחשבת נשלטת.</p>
   <div class="row"><select id="c-mod" aria-label="נושא">${Object.keys(TOPICS).map(k=>`<option value="${k}"${k===C.mod?' selected':''}>${esc(TOPICS[k])}</option>`).join('')}</select>
    <span class="boxes"><span>חדשות ${cnt[0]}</span><span>בלמידה ${cnt[1]+cnt[2]}</span><span>נשלטות ${cnt[3]}</span></span></div>
   <div class="fcard">
    ${C.flip?`<div class="back"><p class="big" style="text-align:center">${esc(f.n)}</p><h3>${esc(f.he)}</h3><p>${fmt(f.d)}</p>${f.lov?`<dl class="lovl">${f.lov.map(v=>`<div><dt>${esc(v[0])}</dt><dd>${fmt(v[1])}</dd></div>`).join('')}</dl>`:''}${f.tip?`<p class="tip"><b>למיישם:</b> ${fmt(f.tip)}</p>`:''}</div>`
     :`<p class="small muted">${en(x.scr.name+' / '+x.tab.name)}</p><p class="big">${esc(f.n)}</p><p class="muted">מה השדה הזה עושה${f.lov?', ואילו ערכים יש בו':''}?</p>`}
   </div>
   <div class="row">${C.flip?`<button class="btn ghost" data-g="0">לא ידעתי</button><button class="btn" data-g="1">ידעתי</button>`:`<button class="btn" id="c-flip">הפיכה</button><button class="btn ghost" id="c-skip">דילוג</button>`}</div>`;
  $('#c-mod').onchange=e=>{C.mod=e.target.value; C.id=null; drawCards();};
  const fl=$('#c-flip'); if(fl) fl.onclick=()=>{C.flip=true; S.seen[C.id]=1; save(); drawCards();};
  const sk=$('#c-skip'); if(sk) sk.onclick=()=>{nextCard(); drawCards();};
  $$('[data-g]',box).forEach(b=>b.onclick=()=>{
    const cur=S.box[C.id]||0; S.box[C.id]=b.dataset.g==='1'?Math.min(3,cur+1):Math.max(1,cur-1); save(); nextCard(); drawCards();
  });
}
/* --- quiz --- */
let Q=null, qTopic='all';
function autoLov(pool){
  const x=pick(pool), lov=x.f.lov, right=pick(lov);
  let opts=shuffle(lov).slice(0,4); if(opts.indexOf(right)<0){opts[0]=right; opts=shuffle(opts);}
  return {h:`במסך ${en(x.scr.name)}, בשדה ${en(x.f.n)}: איזה ערך מתאים לתיאור הזה?<q>${fmt(right[1])}</q>`,o:opts.map(v=>en(v[0])),a:opts.indexOf(right),eh:`${en(right[0])}: ${fmt(right[1])}`};
}
function autoTab(){
  const item=SCREENS.find(s=>s.id==='item'), fs=FIELDS.filter(x=>x.scr===item), x=pick(fs);
  let opts=shuffle(item.tabs.filter(t=>t!==x.tab)).slice(0,3).concat([x.tab]); opts=shuffle(opts);
  return {h:`באיזו לשונית של ${en('Master Item')} נמצא השדה ${en(x.f.n)}?`,o:opts.map(t=>en(t.name)),a:opts.indexOf(x.tab),eh:`${en(x.f.n)} נמצא בלשונית ${en(x.tab.name)}. ${fmt(x.f.d)}`};
}
function buildQuiz(topic){
  const hand=shuffle(QUIZ.filter(q=>topic==='all'||q.t===topic)).slice(0,6).map(q=>{
    const idx=shuffle(q.o.map((_,i)=>i));
    return {h:fmt(q.q),o:idx.map(i=>fmt(q.o[i])),a:idx.indexOf(q.a),eh:fmt(q.e)};
  });
  const pool=FIELDS.filter(x=>x.f.lov&&x.f.lov.length>=2&&(topic==='all'||x.scr.mod===topic));
  const out=hand.slice(); const used={};
  let guard=0;
  while(out.length<10&&guard++<60){
    const q=(topic==='all'||topic==='inv')&&Math.random()<0.25?autoTab():(pool.length?autoLov(pool):null);
    if(!q) break; if(used[q.h]) continue; used[q.h]=1; out.push(q);
  }
  return shuffle(out);
}
function drawQuizStart(){
  const box=$('#prac'); if(!box) return;
  box.innerHTML=`
   <p class="lead">עשר שאלות: החלטות של מיישם, משמעות של ערכי LOV, ומיקום של שדות. אחרי כל תשובה מופיע הסבר.</p>
   <div class="row"><select id="q-topic" aria-label="נושא החידון">${Object.keys(TOPICS).map(k=>`<option value="${k}"${k===qTopic?' selected':''}>${esc(TOPICS[k])}</option>`).join('')}</select>
    <button class="btn" id="q-go">התחלת חידון</button></div>
   <p class="small muted">${S.quiz.n?`עד עכשיו עניתם על ${S.quiz.n} שאלות, ${Math.round(S.quiz.c/S.quiz.n*100)}% מהן נכון.`:'עוד לא עניתם על שאלות.'}</p>`;
  $('#q-topic').onchange=e=>{qTopic=e.target.value;};
  $('#q-go').onclick=()=>{Q={qs:buildQuiz(qTopic),i:0,c:0,ans:null,wrong:[]}; drawQuiz();};
}
function drawQuiz(){
  const box=$('#prac'); if(!box||!Q) return;
  if(Q.i>=Q.qs.length){
    box.innerHTML=`<h2>${Q.c} מתוך ${Q.qs.length}</h2>
     <p class="lead">${Q.wrong.length?'אלה השאלות שכדאי לחזור עליהן:':'כל התשובות נכונות.'}</p>
     ${Q.wrong.map(q=>`<div class="q-exp no"><p>${q.h}</p><p class="small"><b>התשובה:</b> ${q.o[q.a]}. ${q.eh}</p></div>`).join('')}
     <div class="row"><button class="btn" id="q-again">חידון נוסף</button></div>`;
    $('#q-again').onclick=drawQuizStart; return;
  }
  const q=Q.qs[Q.i], answered=Q.ans!=null;
  box.innerHTML=`
   <p class="small muted">שאלה ${Q.i+1} מתוך ${Q.qs.length}</p>
   <p class="q-text">${q.h}</p>
   <div class="q-opts">${q.o.map((o,i)=>`<button data-o="${i}" ${answered?'disabled':''} class="${answered&&i===q.a?'ok':''} ${answered&&i===Q.ans&&i!==q.a?'no':''}">${o}</button>`).join('')}</div>
   <div role="status" aria-live="polite">${answered?`<div class="q-exp ${Q.ans===q.a?'ok':'no'}"><b>${Q.ans===q.a?'נכון.':'לא נכון.'}</b> ${q.eh}</div>`:''}</div>
   ${answered?`<div><button class="btn" id="q-next">${Q.i+1<Q.qs.length?'השאלה הבאה':'סיכום'}</button></div>`:''}`;
  $$('[data-o]',box).forEach(b=>b.onclick=()=>{
    Q.ans=+b.dataset.o; S.quiz.n++; if(Q.ans===q.a){Q.c++; S.quiz.c++;} else Q.wrong.push(q); save(); drawQuiz();
  });
  const nx=$('#q-next'); if(nx){nx.onclick=()=>{Q.i++; Q.ans=null; drawQuiz();}; nx.focus();}
}

/* ================= glossary ================= */
function vGlossary(){
  main.innerHTML=`<div class="view">
   <section class="stack"><h1>מילון מונחים</h1>
    <p class="lead">המונחים שתשמעו בכל ישיבת יישום, באנגלית כפי שהם מופיעים במערכת, ובעברית.</p>
    <input id="g-q" type="search" placeholder="חיפוש מונח" aria-label="חיפוש מונח"></section>
   <dl class="gl" id="g-list"></dl></div>`;
  const draw=q=>{
    const lq=q.toLowerCase();
    const rows=GLOSS.filter(g=>!q||g[0].toLowerCase().indexOf(lq)>=0||g[1].indexOf(q)>=0||g[2].indexOf(q)>=0);
    $('#g-list').innerHTML=rows.length?rows.map(g=>`<div><dt>${esc(g[0])}</dt><dd><b>${esc(g[1])}</b><br><span class="muted">${esc(g[2])}</span></dd></div>`).join(''):'<p class="muted">לא נמצא מונח כזה.</p>';
  };
  $('#g-q').oninput=e=>draw(e.target.value.trim()); draw('');
}

/* ================= about ================= */
function vAbout(){
  const flagged=FIELDS.filter(x=>x.f.v).length;
  main.innerHTML=`<div class="view">
   <section class="prose"><h1>דיוק ומקורות</h1>
    <p>האפליקציה נבנתה ללימוד עצמי של ${en('Oracle E-Business Suite R12')}, הגרסה שעובדת עם מסכי Forms. היא אינה מוצר רשמי של Oracle, והיא אינה מחליפה את התיעוד הרשמי או את המערכת שלכם.</p></section>
   <section class="prose"><h2>על מה התוכן מבוסס</h2>
    <p>ערכי רשימות הערכים (LOV), כללי ההורשה והכללים של עצי מוצר, מסלולים, פקודות עבודה ותכנון נבדקו בנובמבר 2026 מול מדריכי המשתמש הרשמיים של גרסה 12.2 באתר התיעוד של Oracle. התוכן לא נבדק מול המערכת שלכם.</p>
    <ul>
     <li>${en("Oracle Inventory User's Guide")} (${en('E48820')})</li>
     <li>${en("Oracle Bills of Material User's Guide")} (${en('E48954')})</li>
     <li>${en("Oracle Work in Process User's Guide")} (${en('E48905')})</li>
     <li>${en("Oracle MRP User's Guide")} (${en('E48795')})</li>
    </ul>
    <p>ספריית התיעוד של גרסה 12.2: <a href="https://docs.oracle.com/cd/E26401_01/index.htm" target="_blank" rel="noopener">docs.oracle.com/cd/E26401_01</a></p>
    <p>${flagged} מתוך ${FIELDS.length} השדות מסומנים <span class="b f">לאמת</span>, ובכל אחד מהם כתוב מה בדיוק לא אומת. שמות השדות עצמם, הערכים שמוצגים בהם כדוגמה, ההסברים בעברית והטיפים למיישם נכתבו מהיכרות כללית עם המערכת, ולא כולם נבדקו מילה במילה מול המדריך.</p>
    <p>במקומות שבהם המדריך של 12.1 שונה מזה של 12.2 מופיעה הערה על הבדל בין גרסאות.</p></section>
   <section class="prose"><h2>מה לבדוק אצלכם בכל מקרה</h2>
    <ul>
     <li>הגרסה המדויקת של המערכת. שמות שדות וערכים משתנים מעט בין גרסאות.</li>
     <li>התאמות שנעשו אצלכם: שדות שהוסתרו, שדות שנוספו, ורשימות ערכים שהורחבו.</li>
     <li>נתיבי התפריט. הם תלויים בתחום האחריות (Responsibility) שהוגדר לכם.</li>
     <li>רמות השליטה בפועל, במסך ${en('Item Attribute Controls')}. הסימונים M ו-O כאן הם נוהג מקובל, לא ההגדרה שלכם.</li>
     <li>שפת המסכים. אם המערכת אצלכם מתורגמת לעברית, שמות השדות יהיו שונים.</li>
    </ul></section>
   <section class="prose"><h2>ההתקדמות שלכם</h2>
    <p>ההתקדמות נשמרת בדפדפן הזה בלבד. היא לא עוברת למכשיר אחר, ועלולה להימחק אם מנקים את נתוני הדפדפן.</p>
    <div class="row" id="reset-box"><button class="btn ghost" id="reset">איפוס ההתקדמות</button></div></section>
  </div>`;
  $('#reset').onclick=()=>{
    $('#reset-box').innerHTML='<span>לאפס את כל ההתקדמות?</span> <button class="btn" id="reset-y">כן, לאפס</button> <button class="btn ghost" id="reset-n">ביטול</button>';
    $('#reset-y').onclick=()=>{S={seen:{},box:{},lov:{},mis:{},quiz:{n:0,c:0},last:{scr:'item',tab:0}}; save(); toast('ההתקדמות אופסה'); vAbout();};
    $('#reset-n').onclick=vAbout;
  };
}

/* ================= router ================= */
const main=$('#main');
const VIEWS={home:vHome,inherit:vInherit,screens:vScreens,practice:vPractice,glossary:vGlossary,about:vAbout};
function route(){
  const h=(location.hash||'').replace('#','');
  const v=VIEWS[h]?h:'home';
  $$('#nav a').forEach(a=>{ if(a.getAttribute('href')==='#'+v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  VIEWS[v]();
  window.scrollTo(0,0);
  const cur=$('#nav a[aria-current]'); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest',inline:'nearest'});
}
window.addEventListener('hashchange',route);
drawProg(); route();
})();
</script>
