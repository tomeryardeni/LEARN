<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אקדמיית האיפיון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column, max 880px. Lessons carry warehouse-location style codes (M1-01);
   the lesson "screen" is always dark, like a monitor on the warehouse floor; yellow floor-tape marks progress. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#15203A; --muted:#566079; --line:#D3DAE6;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --tape:#F2B705; --tape-ink:#2A2100;
  --good:#14704A; --good-bg:#DDF3E8; --bad:#B3261E; --bad-bg:#FBE4E2;
  --stage-bg:#121C38; --stage-fg:#F1F4FB; --stage-muted:#A9B4D0; --stage-card:#1E2B52; --stage-line:#34437A;
  --f-display:"Rubik","Heebo","Arial Hebrew",Arial,sans-serif;
  --f-body:"Heebo","Arial Hebrew",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#171F38; --ink:#E8ECF6; --muted:#9BA7C3; --line:#2C3859;
  --accent:#86A8FF; --accent-ink:#0B1330; --tape:#F2B705; --tape-ink:#2A2100;
  --good:#63D49C; --good-bg:#12352A; --bad:#FF8F85; --bad-bg:#401C1B;
  --stage-bg:#080D1B; --stage-fg:#F1F4FB; --stage-muted:#A9B4D0; --stage-card:#172142; --stage-line:#2F3C6E;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#171F38; --ink:#E8ECF6; --muted:#9BA7C3; --line:#2C3859;
  --accent:#86A8FF; --accent-ink:#0B1330; --tape:#F2B705; --tape-ink:#2A2100;
  --good:#63D49C; --good-bg:#12352A; --bad:#FF8F85; --bad-bg:#401C1B;
  --stage-bg:#080D1B; --stage-fg:#F1F4FB; --stage-muted:#A9B4D0; --stage-card:#172142; --stage-line:#2F3C6E;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
#app{max-width:880px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.code{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:start}
.brand .mark{width:34px;height:34px;border-radius:4px;flex:none;
  background:repeating-linear-gradient(135deg,var(--tape) 0 7px,var(--ink) 7px 14px)}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.intro{display:flex;flex-direction:column;gap:8px}
.intro p{max-width:62ch}

.pace-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:620px){.pace-grid{grid-template-columns:1fr}}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:.8rem;color:var(--muted)}
.stat .val{font-family:var(--f-display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px;align-items:center;height:2rem}
.dot{width:26px;height:26px;border-radius:4px;border:2px solid var(--line)}
.dot.on{background:var(--tape);border-color:var(--tape)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape);transition:width .3s}
.pill{display:inline-block;font-size:.78rem;font-weight:500;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--tape);color:var(--tape-ink);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.next{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}

.module{display:flex;flex-direction:column;gap:8px}
.module>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:start;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.row .t{min-width:0;font-weight:500}
.row .code{color:var(--muted)}

.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:8px;flex-wrap:wrap}

/* player */
.stage{background:var(--stage-bg);color:var(--stage-fg);border-radius:12px;padding:22px 20px;min-height:330px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.stage .eyebrow{font-size:.8rem;color:var(--stage-muted);display:flex;justify-content:space-between;gap:10px}
.stage h3{font-size:1.35rem;font-weight:700;color:var(--stage-fg)}
.stage .body{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.it{opacity:1;transform:none;transition:opacity .45s,transform .45s}
.it.hid{opacity:0;transform:translateY(10px)}
@media (prefers-reduced-motion:reduce){.it{transition:none}.it.hid{transform:none}.bar i{transition:none}}
.pt{background:var(--stage-card);border:1px solid var(--stage-line);border-inline-start:4px solid var(--tape);padding:10px 14px;border-radius:6px}
.flow{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:center}
.fx{display:flex;align-items:center;gap:6px}
.fbox{background:var(--stage-card);border:1px solid var(--stage-line);padding:9px 13px;border-radius:6px;font-weight:500}
.farrow{color:var(--tape);font-weight:700}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp>div{background:var(--stage-card);border:1px solid var(--stage-line);border-radius:6px;padding:12px 14px;min-width:0}
.cmp .tag{font-size:.78rem;font-weight:700;display:block;margin-bottom:4px}
.cmp .b .tag{color:#FF9D94}.cmp .g .tag{color:#7FE0AE}
.tw{overflow-x:auto}
.stage table{border-collapse:collapse;width:100%;font-size:.92rem}
.stage th,.stage td{border:1px solid var(--stage-line);padding:7px 10px;text-align:start;vertical-align:top}
.stage th{background:var(--stage-card);color:var(--stage-muted);font-weight:500;font-size:.8rem}
.caption{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:4.6em}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls .grow{flex:1;min-width:120px}
.controls select{font:inherit;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}

.qbox{border:2px solid var(--tape);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.q{display:flex;flex-direction:column;gap:8px}
.q+.q{border-top:1px solid var(--line);padding-top:14px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;text-align:start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:500}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:.9rem;color:var(--muted)}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;width:100%;min-height:210px;resize:vertical;line-height:1.6}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start}
.checks input{margin-top:.35em;flex:none}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-weight:500}
.model{white-space:pre-wrap;margin-top:8px;font-size:.95rem}
.rowend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:.85rem;color:var(--muted);max-width:70ch}
</style>

<div id="app" dir="rtl" lang="he"></div>

<script>
document.documentElement.dir='rtl';document.documentElement.lang='he';

/* ============ תוכן הקורס ============ */
const MODULES=['יסודות האיפיון','תהליכים ותרחישים','נתונים, מסכים והרשאות','מערכות מחסן (WMS)','הובלה (TMS) וממשקים','רמת מקצוען'];
const P=(h,items,say,q)=>({k:'points',h,items,say,q});
const F=(h,items,say,q)=>({k:'flow',h,items,say,q});
const C=(h,bad,good,say,q)=>({k:'cmp',h,bad,good,say,q});
const T=(h,head,rows,say,q)=>({k:'table',h,head,rows,say,q});
const Q=(q,a,c,why)=>({q,a,c,why});

const LESSONS=[
/* ---------- מודול 1 ---------- */
{m:0,t:'מהו מסמך איפיון ולמי הוא נכתב',scenes:[
 P('מה מסמך איפיון עושה',['מתאר מה המערכת צריכה לעשות, לפני שבונים אותה','משמש הסכם בין העסק, המיישמים והבודקים','בסיס להערכת עלות, לפיתוח ולבדיקות קבלה'],'מסמך איפיון מתאר מה המערכת צריכה לעשות לפני שמתחילים לבנות. הוא ההסכם בין מי שצריך את המערכת לבין מי שבונה ובודק אותה.'),
 T('שלושה סוגי מסמכים נפוצים',['מסמך','עונה על השאלה','קהל עיקרי'],[['דרישות עסקיות (BRD)','למה, ומה העסק צריך','הנהלה ובעלי עניין'],['איפיון פונקציונלי (FSD / SRS)','מה המערכת עושה','מיישמים, בודקים, משתמשי מפתח'],['תכנון טכני','איך זה ייבנה','מפתחים וארכיטקטים']],'נהוג להבחין בין שלוש רמות: דרישות עסקיות, איפיון פונקציונלי ותכנון טכני. שמות המסמכים משתנים בין ארגונים, אבל ההבחנה בין למה, מה ואיך נשארת.',
  Q('מפתח שואל באיזו טבלה במסד הנתונים יישמר שדה מסוים. באיזה מסמך אמורה להיות התשובה?',['דרישות עסקיות','איפיון פונקציונלי','תכנון טכני'],2,'מבנה טבלאות הוא שאלה של "איך". האיפיון הפונקציונלי מגדיר שהשדה קיים ומה הכללים שלו.')),
 P('מי קורא את המסמך',['מנהל המחסן: בודק שהתהליך המתואר נכון','המיישם: צריך פרטים חד-משמעיים','הבודק: גוזר מהמסמך תרחישי בדיקה','מנהל הפרויקט: גוזר היקף ולוח זמנים'],'לכל קורא יש צורך אחר. מנהל המחסן רוצה לזהות את התהליך שלו. המיישם צריך פרטים בלי מקום לפרשנות. הבודק צריך משהו שאפשר לבדוק.'),
 C('ניסוח שאפשר לבדוק','המערכת תנהל את המלאי בצורה יעילה.','בעת אישור קליטה, המערכת תעדכן את יתרת המלאי באיתור הקליטה בכמות שנקלטה.','השוו בין שני הניסוחים. את הראשון אי אפשר לבדוק, כי אין הגדרה ליעילה. השני מגדיר מתי, מה ואיפה.',
  Q('מה הבעיה המרכזית במשפט "המערכת תהיה ידידותית למשתמש"?',['הוא ארוך מדי','אי אפשר לבדוק אם הוא התקיים','הוא טכני מדי'],1,'בלי מדד (למשל מספר הקשות לביצוע פעולה) אין דרך להחליט אם הדרישה מולאה.')),
 F('מקומו של האיפיון בפרויקט',['צורך עסקי','איסוף דרישות','איפיון','אישור','פיתוח או הטמעה','בדיקות קבלה','עלייה לאוויר'],'האיפיון נכתב אחרי איסוף הדרישות ולפני הפיתוח, ומאושר על ידי בעלי העניין. בדיקות הקבלה חוזרות אליו כדי לבדוק שמה שנבנה הוא מה שסוכם.')
],quiz:[
 Q('מה תפקידו המרכזי של איפיון פונקציונלי?',['לתאר את קוד המערכת','להגדיר מה המערכת תעשה, באופן שאפשר לפתח ולבדוק לפיו','להציג את תקציב הפרויקט'],1,'האיפיון מגדיר את ה"מה", ברמת פירוט שמספיקה לפיתוח ולבדיקה.'),
 Q('מי אמור לאשר את האיפיון לפני תחילת הפיתוח?',['רק צוות הפיתוח','בעלי העניין העסקיים והגורמים המיישמים','אף אחד, זה מסמך פנימי'],1,'אישור של שני הצדדים הופך את המסמך להסכם מחייב על ההיקף.'),
 Q('איזה משפט מתאים לאיפיון פונקציונלי?',['המערכת תיכתב ב-Java','המערכת תאפשר למחסנאי לסרוק מק"ט ולהזין כמות שנקלטה','המלאי חשוב לחברה'],1,'הוא מתאר התנהגות של המערכת מול משתמש, בלי להיכנס לטכנולוגיה.')
],ex:{task:'כתבו פסקת "מטרה ותחולה" (עד חצי עמוד) לאיפיון של תהליך קליטת סחורה במחסן באמצעות מסופון. ציינו מה כלול, מה לא כלול, ומי קהל היעד של המסמך.',
 checks:['המטרה מנוסחת במשפט אחד או שניים','כתוב במפורש מה כלול בתחולה','כתוב במפורש מה מחוץ לתחולה','מצוין מי קוראי המסמך'],
 model:'מטרה: מסמך זה מגדיר את הדרישות הפונקציונליות לתהליך קליטת סחורה מספקים במחסן המרכזי באמצעות מסופון.\n\nבתחולה: קליטה מול הזמנת רכש, סריקת מק"ט וכמות, טיפול בחריגות כמות, הדפסת מדבקת משטח.\n\nמחוץ לתחולה: החזרות מלקוחות, בקרת איכות מעבדתית, הקמת הזמנות רכש ב-ERP.\n\nקהל יעד: מנהל המחסן, צוות היישום של ה-WMS, צוות הבדיקות.'}},

{m:0,t:'מבנה מסמך איפיון מקצועי',scenes:[
 P('פרקי הפתיחה',['מטרה ותחולה: מה בפנים ומה בחוץ','מילון מונחים וקיצורים','בעלי עניין ותפקידים','הנחות, אילוצים ותלויות'],'מסמך מקצועי נפתח במסגרת: מה המטרה, מה בתחולה ומה לא, מה פירוש המונחים, ועל אילו הנחות המסמך נשען.'),
 P('גוף המסמך',['תיאור המצב הקיים והמצב הרצוי','תהליכים ותרחישי שימוש','דרישות פונקציונליות ממוספרות','נתונים, מסכים, דוחות והרשאות','ממשקים למערכות אחרות','דרישות לא פונקציונליות'],'בגוף המסמך עוברים מהתמונה הכללית אל הפרטים: קודם התהליך, אחר כך הדרישות, ואז הנתונים, המסכים, הממשקים והדרישות הלא פונקציונליות.',
  Q('איפה נכון לכתוב ש"החזרות מלקוחות אינן חלק מהפרויקט"?',['בדרישות הלא פונקציונליות','בפרק התחולה, תחת "מחוץ לתחולה"','בנספחים'],1,'גבולות ההיקף שייכים לפרק התחולה, כדי שייראו בתחילת המסמך.')),
 P('פרקי הסיום',['שאלות פתוחות, עם אחראי ותאריך יעד','היסטוריית גרסאות ושינויים','נספחים: דוגמאות, טפסים, קבצים לדוגמה'],'בסוף המסמך מרכזים את מה שעדיין פתוח ואת היסטוריית הגרסאות. שאלה פתוחה בלי אחראי ובלי תאריך נוטה להישאר פתוחה.'),
 T('מילון מונחים: דוגמה',['מונח','הגדרה'],[['מק"ט','מזהה ייחודי של פריט בקטלוג'],['איתור','מיקום פיזי במחסן שאפשר לאחסן בו מלאי'],['ASN','הודעה מוקדמת מהספק על משלוח שבדרך']],'מילון מונחים חוסך ויכוחים. המילה משטח יכולה להיות יחידת אחסון, יחידת שינוע או יחידת מכירה, וכדאי להגדיר למה הכוונה במסמך הזה.',

/* ============ מצב ושמירה ============ */
const KEY='spec-academy-v1', PER_WEEK=3, DAY=864e5;
let S={start:null,voice:true,rate:1,L:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.start)S.start=new Date().toISOString();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const st=id=>S.L[id]||(S.L[id]={video:false,quiz:null,ex:false,text:'',checks:[],done:null});
const quizPass=l=>{const s=st(l.id);return s.quiz!==null&&s.quiz>=Math.ceil(l.quiz.length*2/3)};
function refreshDone(l){const s=st(l.id);if(s.video&&quizPass(l)&&s.ex&&!s.done)s.done=new Date().toISOString();save()}
const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x};
function pace(now){
  const done=LESSONS.filter(l=>st(l.id).done), ws=weekStart(now);
  const thisWeek=done.filter(l=>new Date(st(l.id).done)>=ws).length;
  const weeks=Math.round((ws-weekStart(S.start))/(7*DAY));
  const expected=Math.min(LESSONS.length,weeks*PER_WEEK);
  const before=done.length-thisWeek, gap=expected-before;
  const remaining=LESSONS.length-done.length;
  const finish=new Date(+now+Math.ceil(Math.max(0,remaining-Math.max(0,PER_WEEK-thisWeek))/PER_WEEK)*7*DAY);
  return{done:done.length,thisWeek,gap,remaining,finish};
}

/* ============ נגן השיעור ============ */
let PL={i:0,playing:false,elapsed:0,dur:0,spoken:true,tick:null,waitQ:false,answered:{}};
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let heVoice=null;
function loadVoices(){if(!synth)return;const v=synth.getVoices().find(v=>/^he|^iw/i.test(v.lang));if(v&&!heVoice){heVoice=v;const el=document.getElementById('voiceNote');if(el)el.textContent=''}}
if(synth){loadVoices();try{synth.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const voiceOn=()=>!!(synth&&heVoice&&S.voice);
function stopPlayer(){PL.playing=false;clearInterval(PL.tick);PL.tick=null;if(synth)try{synth.cancel()}catch(e){}}
function sceneBody(sc){
  if(sc.k==='points')return sc.items.map(t=>`<div class="pt it">${esc(t)}</div>`).join('');
  if(sc.k==='flow')return `<div class="flow">${sc.items.map((t,i)=>`<span class="fx it">${i?'<span class="farrow" aria-hidden="true">←</span>':''}<span class="fbox">${esc(t)}</span></span>`).join('')}</div>`;
  if(sc.k==='cmp')return `<div class="cmp"><div class="b it"><span class="tag">לא כך</span>${esc(sc.bad)}</div><div class="g it"><span class="tag">אלא כך</span>${esc(sc.good)}</div></div>`;
  return `<div class="tw"><table><thead><tr>${sc.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${sc.rows.map(r=>`<tr class="it">${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function drawScene(hide){
  const l=view.lesson, sc=l.scenes[PL.i];
  document.getElementById('stage').innerHTML=`<div class="eyebrow"><span class="code">${l.id}</span><span>חלק ${PL.i+1} מתוך ${l.scenes.length}</span></div><h3>${esc(sc.h)}</h3><div class="body">${sceneBody(sc)}</div>`;
  document.getElementById('caption').textContent=sc.say;
  if(hide)document.querySelectorAll('#stage .it').forEach(e=>e.classList.add('hid'));
  document.getElementById('qslot').innerHTML='';
  updateBar();
}
function updateBar(){
  const l=view.lesson, frac=PL.dur?Math.min(1,PL.elapsed/PL.dur):0;
  const el=document.getElementById('pbar');if(el)el.style.width=((PL.i+(PL.playing||PL.waitQ?frac:0))/l.scenes.length*100)+'%';
  const b=document.getElementById('playBtn');if(b)b.textContent=PL.playing?'השהה':'נגן';
  const pv=document.getElementById('prevBtn'),nx=document.getElementById('nextBtn');
  if(pv)pv.disabled=PL.i===0;if(nx)nx.disabled=PL.i===l.scenes.length-1;
}
function startScene(){
  const sc=view.lesson.scenes[PL.i];
  PL.waitQ=false;PL.elapsed=0;PL.dur=Math.max(6000,sc.say.length*75)/S.rate;PL.spoken=true;
  drawScene(true);
  if(voiceOn()){
    PL.spoken=false;
    try{synth.cancel();const u=new SpeechSynthesisUtterance(sc.say);u.voice=heVoice;u.lang=heVoice.lang;u.rate=S.rate;const idx=PL.i;
      u.onend=u.onerror=()=>{if(PL.i===idx)PL.spoken=true};synth.speak(u)}catch(e){PL.spoken=true}
  }
  clearInterval(PL.tick);let last=Date.now();
  PL.tick=setInterval(()=>{
    const n=Date.now();PL.elapsed+=n-last;last=n;
    const its=document.querySelectorAll('#stage .it'),k=its.length;
    its.forEach((e,i)=>{if(PL.elapsed>=PL.dur*0.75*(i+0.4)/k)e.classList.remove('hid')});
    updateBar();
    if((PL.elapsed>=PL.dur&&PL.spoken)||PL.elapsed>=PL.dur*3)sceneEnd();
  },120);
}
function sceneEnd(){
  clearInterval(PL.tick);PL.tick=null;
  const l=view.lesson, sc=l.scenes[PL.i];
  document.querySelectorAll('#stage .it').forEach(e=>e.classList.remove('hid'));
  if(sc.q&&!PL.answered[PL.i]){PL.playing=false;PL.waitQ=true;showInlineQ(sc.q);updateBar();return}
  advance();
}
function advance(){
  const l=view.lesson;
  if(PL.i<l.scenes.length-1){PL.i++;PL.playing=true;startScene()}
  else{PL.playing=false;PL.waitQ=false;st(l.id).video=true;refreshDone(l);
    document.getElementById('pbar').style.width='100%';updateBar();renderSteps();
    document.getElementById('qslot').innerHTML=`<div class="qbox"><b>סיימתם את השיעור.</b><div class="rowend"><a class="btn primary" href="#quiz" id="toQuiz" style="text-decoration:none">לבוחן</a><button class="btn" id="replayBtn">צפייה חוזרת</button></div></div>`}
}
function qHtml(q,name){return `<div class="q" data-q="${name}"><b>${esc(q.q)}</b><div class="opts">${q.a.map((a,i)=>`<button class="opt" data-i="${i}">${esc(a)}</button>`).join('')}</div><div class="why" hidden></div></div>`}
function answer(qEl,q,i){
  qEl.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  const w=qEl.querySelector('.why');w.hidden=false;w.textContent=(i===q.c?'נכון. ':'לא מדויק. ')+q.why;return i===q.c;
}
function showInlineQ(q){
  const slot=document.getElementById('qslot');
  slot.innerHTML=`<div class="qbox" id="inq"><span class="small muted">שאלה לפני שממשיכים</span>${qHtml(q,'in')}<div class="rowend"><button class="btn primary" id="contBtn" hidden>המשך בשיעור</button></div></div>`;
  slot.querySelector('.opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;
    answer(slot.querySelector('.q'),q,+b.dataset.i);PL.answered[PL.i]=true;const c=document.getElementById('contBtn');c.hidden=false;c.focus()});
}

/* ============ דף מפגש ============ */
function renderSteps(){
  const l=view.lesson,s=st(l.id),el=document.getElementById('steps');if(!el)return;
  const pill=(ok,txt)=>`<span class="pill ${ok?'good':''}">${ok?'✓ ':''}${txt}</span>`;
  el.innerHTML=pill(s.video,'שיעור')+pill(quizPass(l),'בוחן'+(s.quiz!==null?' '+s.quiz+" מתוך "+l.quiz.length:""))+pill(s.ex,'תרגיל כתיבה')+(s.done?'<span class="pill good">המפגש הושלם</span>':'');
}
function renderQuiz(){
  const l=view.lesson,box=document.getElementById('quizBody');let got=0,n=0;
  box.innerHTML=l.quiz.map((q,i)=>qHtml(q,i)).join('')+'<div class="rowend"><b id="quizRes"></b><button class="btn" id="quizRetry" hidden>ניסיון נוסף</button></div>';
  box.onclick=e=>{
    if(e.target.id==='quizRetry'){renderQuiz();return}
    const b=e.target.closest('.opt');if(!b||b.disabled)return;const qEl=b.closest('.q');
    if(answer(qEl,l.quiz[+qEl.dataset.q],+b.dataset.i))got++;n++;
    if(n===l.quiz.length){const s=st(l.id);s.quiz=Math.max(s.quiz===null?0:s.quiz,got);refreshDone(l);
      const pass=got>=Math.ceil(l.quiz.length*2/3);
      document.getElementById('quizRes').textContent='ציון: '+got+' מתוך '+l.quiz.length+(pass?'. עברתם.':'. נדרשות לפחות '+Math.ceil(l.quiz.length*2/3)+' תשובות נכונות.');
      document.getElementById('quizRetry').hidden=false;renderSteps()}
  };
}
function renderLesson(){
  const l=view.lesson,s=st(l.id),nxt=LESSONS[l.i+1];
  PL={i:0,playing:false,elapsed:0,dur:0,spoken:true,tick:null,waitQ:false,answered:{}};
  app.innerHTML=header()+`
  <div class="intro"><div class="crumbs"><span class="code muted">${l.id}</span><span class="small muted">${esc(MODULES[l.m])}</span></div><h1>${esc(l.t)}</h1><div class="steps" id="steps"></div></div>
  <section class="panel" aria-label="שיעור"><h2>שיעור</h2>
    <div class="stage" id="stage"></div>
    <div class="bar"><i id="pbar" style="width:0"></i></div>
    <div class="caption" id="caption" aria-live="polite"></div>
    <div class="controls">
      <button class="btn primary" id="playBtn">נגן</button>
      <button class="btn" id="prevBtn">הקודם</button><button class="btn" id="nextBtn">הבא</button>
      <span class="grow"></span>
      <label class="chk"><input type="checkbox" id="voiceChk" ${S.voice?'checked':''}> קריינות</label>
      <label class="chk">מהירות <select id="rateSel">${[0.8,1,1.25,1.5].map(r=>`<option value="${r}" ${r===S.rate?'selected':''}>${r}×</option>`).join('')}</select></label>
    </div>
    <div class="small muted" id="voiceNote">${heVoice?'':'לא נמצא במכשיר קול בעברית. השיעור יתקדם עם כתוביות בלבד.'}</div>
    <div id="qslot"></div>
  </section>
  <section class="panel" id="quiz" aria-label="בוחן"><h2>בוחן</h2><div id="quizBody" style="display:flex;flex-direction:column;gap:14px"></div></section>
  <section class="panel" aria-label="תרגיל כתיבה"><h2>תרגיל כתיבה</h2>
    <p style="white-space:pre-wrap;max-width:70ch">${esc(l.ex.task)}</p>
    <label class="small muted" for="exText-${l.id}">הטקסט נשמר אוטומטית בדפדפן</label>
    <textarea id="exText-${l.id}" placeholder="כתבו כאן, או כתבו במסמך שלכם וחזרו לבדיקה העצמית.">${esc(s.text)}</textarea>
    <h3>בדיקה עצמית</h3>
    <div class="checks" id="checks">${l.ex.checks.map((c,i)=>`<label><input type="checkbox" id="chk-${l.id}-${i}" data-c="${i}" ${s.checks[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div>
    <details><summary>פתרון לדוגמה (פתחו רק אחרי שכתבתם)</summary><div class="model">${esc(l.ex.model)}</div></details>
    <div class="rowend"><button class="btn primary" id="exDone">${s.ex?'התרגיל סומן כהושלם':'סיימתי את התרגיל'}</button>${nxt?`<button class="btn" data-lesson="${nxt.i}">למפגש הבא</button>`:''}<button class="btn ghost" data-go="home">חזרה לתוכנית</button></div>
  </section>`;
  drawScene(false);renderSteps();renderQuiz();
}
function render(){view.name==='lesson'?renderLesson():renderHome()}

/* ============ אירועים ============ */
app.addEventListener('click',e=>{
  const t=e.target, g=t.closest('[data-go]'), le=t.closest('[data-lesson]');
  if(g){go('home');return}
  if(le){go('lesson',LESSONS[+le.dataset.lesson]);return}
  const id=t.id;
  if(id==='playBtn'){
    if(PL.waitQ)return;
    if(PL.playing){stopPlayer();drawScene(false);updateBar()}
    else{PL.playing=true;startScene()}
  }else if(id==='prevBtn'||id==='nextBtn'){
    const was=PL.playing;stopPlayer();PL.waitQ=false;PL.i=Math.max(0,Math.min(view.lesson.scenes.length-1,PL.i+(id==='nextBtn'?1:-1)));
    if(was){PL.playing=true;startScene()}else{PL.elapsed=0;drawScene(false)}
  }else if(id==='contBtn'){advance()}
  else if(id==='replayBtn'){PL.i=0;PL.answered={};PL.playing=true;startScene()}
  else if(id==='toQuiz'){e.preventDefault();document.getElementById('quiz').scrollIntoView({behavior:'smooth'})}
  else if(id==='exDone'){const l=view.lesson;st(l.id).ex=true;refreshDone(l);t.textContent='התרגיל סומן כהושלם';renderSteps()}
  else if(id==='resetBtn'){document.getElementById('resetAsk').hidden=false}
  else if(id==='resetNo'){document.getElementById('resetAsk').hidden=true}
  else if(id==='resetYes'){S={start:new Date().toISOString(),voice:true,rate:1,L:{}};save();render()}
});
app.addEventListener('input',e=>{const t=e.target;if(t.tagName==='TEXTAREA'&&view.lesson){st(view.lesson.id).text=t.value;save()}});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='voiceChk'){S.voice=t.checked;save();if(!t.checked&&synth){try{synth.cancel()}catch(x){}PL.spoken=true}}
  else if(t.id==='rateSel'){S.rate=+t.value;save()}
  else if(t.dataset.c!==undefined&&view.lesson){st(view.lesson.id).checks[+t.dataset.c]=t.checked;save()}
});
window.addEventListener('pagehide',stopPlayer);
render();
</script>

</body>
</html>
