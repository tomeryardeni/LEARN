# Free Supabase projects are paused after a period of inactivity.
# This reads one row from the leaderboard once a day so the project stays active.
# The key below is the publishable key that the game page already ships to every browser;
# it can only read the board and call submit_score().
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch: {}     # allows a manual run from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from the leaderboard
        env:
          SB_URL: https://bedmhvvyumnshlytynco.supabase.co/rest/v1
          SB_KEY: sb_publishable_LiGSfu_6f-54c69DkSvdMw_5ZOCWQ0s
        run: |
          status=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SB_URL/scores?select=id&limit=1" -H "apikey: $SB_KEY")
          echo "HTTP $status"
          cat body.txt; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer with 200. The project may be paused; restore it from the Supabase dashboard."
            exit 1
          fi
